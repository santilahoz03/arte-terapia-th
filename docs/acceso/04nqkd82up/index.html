<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>สิทธิ์เข้าถึงของคุณ</title>
<style>
  html, body { margin:0; background:#FAF7F2; color:#2B2522; font-family:'Sarabun',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:64px 20px; text-align:center; }
  .badge { display:inline-block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; background:#EFE6DA; padding:6px 12px; border-radius:99px; }
  h1 { font-size:28px; line-height:1.3; margin:18px 0 10px; }
  p { font-size:17px; line-height:1.6; color:#5B514B; }
  .card { background:#fff; border:1px solid #EAE0D5; border-radius:16px; padding:24px 20px; margin-top:28px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#1F9D55; margin-right:8px; animation:p 1.6s infinite; }
  @keyframes p { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrap">
    <span class="badge">ยืนยันการสั่งซื้อแล้ว</span>
    <h1>คู่มือศิลปะบำบัด</h1>
    <p>ขอบคุณ! เรากำลังเตรียมเนื้อหาของคุณ หน้านี้จะอัปเดตพร้อมไฟล์ทั้งหมดของคุณเร็วๆ นี้</p>
    <div class="card">
      <p><span class="dot"></span><strong>บันทึกลิงก์นี้ไว้</strong></p>
      <p>นี่คือสิทธิ์เข้าถึงตลอดชีพของคุณ กลับมาในอีกไม่กี่ชั่วโมง และคุณจะพบผลิตภัณฑ์หลักและของแถมทั้งหมด</p>
    </div>
  </div>
</body>
</html>
